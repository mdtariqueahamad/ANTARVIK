<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharati Antarctic Research Station - Interactive 3D Model</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b141f; font-family: system-ui, -apple-system, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; }
    .hud-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .hud-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); transition: all 0.18s ease; }
    .hud-btn:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-1px); }
    .active-btn { background: #2563eb !important; border-color: #3b82f6 !important; color: #ffffff !important; }
  </style>
</head>
<body class="select-none text-white">

  <!-- Top Glassmorphic Navigation Bar (Restored Flag) -->
  <header class="absolute top-4 left-4 flex items-center pointer-events-none z-20">
    <div class="hud-card pointer-events-auto rounded-2xl px-4 py-2.5 flex items-center gap-3.5">
      <div class="w-9 h-9 rounded-xl bg-blue-500/20 border border-blue-400/40 flex items-center justify-center text-lg shadow-inner">
        🇮🇳
      </div>
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-sm md:text-base font-bold tracking-tight text-white">
            Bharati Station
          </h1>
          <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
            69°24′S 76°11′E
          </span>
        </div>
      </div>
    </div>
  </header>


  
  <div id="info-overlay" class="hidden absolute bottom-6 left-6 hud-card pointer-events-auto p-4 rounded-2xl max-w-sm text-slate-200 text-xs shadow-2xl border border-white/20 z-20" style="min-width: 220px;">
    <div class="flex items-center justify-between border-b border-white/20 pb-2 mb-2">
      <span class="font-bold text-sm text-white" id="info-name">STRUCTURE</span>
      <button onclick="document.getElementById('info-overlay').classList.add('hidden')" class="text-white/50 hover:text-white">&times;</button>
    </div>
    <div id="info-content" class="flex flex-col gap-1.5 text-[11px] text-white/70">
      <!-- Content injected by JS -->
    </div>
  </div>

  <!-- 3D WebGL Canvas Layer -->
  <div id="canvas-container" class="cursor-grab active:cursor-grabbing"></div>

  <!-- Top Glassmorphic Navigation Bar -->
  

  <!-- Left Floating Views Menu -->
  

  <!-- Right Floating Lighting & Atmosphere Menu -->
  

  <!-- Bottom Floating Hotspots & Inspector -->
