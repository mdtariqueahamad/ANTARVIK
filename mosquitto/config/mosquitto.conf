# ── Eclipse Mosquitto Configuration ──
# ANTARVIK Digital Twin Platform - MQTT Broker

# ── Default MQTT listener ──
listener 1883 0.0.0.0
protocol mqtt

# ── WebSocket listener (for browser clients) ──
listener 9001 0.0.0.0
protocol websockets

# ── Authentication ──
allow_anonymous true

# ── Persistence ──
persistence true
persistence_location /mosquitto/data/

# ── Logging ──
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
